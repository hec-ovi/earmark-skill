name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: SQLite version
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - name: Unit, integration and concurrency tests
        run: python -m unittest discover -s tests -t . -v
      - name: Skill copies in sync
        run: python scripts/sync-skill-copies.py --check
      - name: Package builds and the console script runs
        shell: bash
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist .
          python -m pip install --quiet dist/*.whl
          earmark --help > /dev/null
